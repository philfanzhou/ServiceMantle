name: CI

on:
  # Default-branch pushes are verified by release.yml before package artifacts
  # are published, so CI remains a pull-request verification gate.
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate package registry
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          -- validate

      - name: Restore registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- restore

      - name: Build registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- build
          --version $PACKAGE_VERSION
          --commit ${{ github.sha }}

      - name: Test registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- test

      - name: Pack registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- pack
          --version $PACKAGE_VERSION
          --commit ${{ github.sha }}
          --output artifacts/packages

      - name: Verify package artifacts
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- verify
          --version $PACKAGE_VERSION
          --commit ${{ github.sha }}
          --input artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
