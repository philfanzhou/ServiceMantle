name: CI

on:
  # Default-branch pushes are verified by release.yml before package artifacts
  # are published, so CI remains a pull-request verification gate.
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  release-tool-windows:
    name: Verify ReleaseTool process isolation (Windows)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify process lifetime and cancellation
        run: >-
          dotnet test
          --project tests/ServiceMantle.ReleaseTool.Tests/ServiceMantle.ReleaseTool.Tests.csproj
          --configuration Release
          --timeout 2m
          --minimum-expected-tests 1
          --diagnostic
          --diagnostic-synchronous-write
          --diagnostic-output-directory artifacts/test-diagnostics/release-tool-windows

      - name: Upload test diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate package registry
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          -- validate

      - name: Restore registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- restore

      - name: Build registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- build
          --version $PACKAGE_VERSION
          --commit ${{ github.sha }}

      - name: Start pinned Oracle Database Free
        shell: bash
        run: |
          set -euo pipefail
          oracle_password="Sm$(openssl rand -hex 10)"
          echo "::add-mask::$oracle_password"
          image="container-registry.oracle.com/database/free:23.26.1.0-lite-amd64@sha256:ef1a38683b3783b80e033be6b8f2cb31299dcba5430514ec96e2e8f4f0307d15"
          docker pull "$image"
          docker run --detach --name servicemantle-oracle \
            --publish 127.0.0.1::1521 \
            --env ORACLE_PWD="$oracle_password" \
            "$image"

          oracle_port="$(docker port servicemantle-oracle 1521/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          if [[ ! "$oracle_port" =~ ^[0-9]+$ ]]; then
            echo "Oracle container did not publish a valid listener port." >&2
            exit 1
          fi

          bash eng/tests/oracle-readiness.sh
          if ! timeout 15m bash eng/wait-oracle-ready.sh servicemantle-oracle; then
            echo "Oracle readiness failed within its 15-minute budget." >&2
            exit 1
          fi

          admin_connection="User Id=system;Password=$oracle_password;Data Source=127.0.0.1:$oracle_port/FREEPDB1;Pooling=false;Enlist=false"
          echo "::add-mask::$admin_connection"
          echo "RUN_SERVICEMANTLE_ORACLE_TESTS=true" >> "$GITHUB_ENV"
          echo "SERVICEMANTLE_ORACLE_ADMIN_CONNECTION_STRING=$admin_connection" >> "$GITHUB_ENV"

      - name: Verify Oracle listener with ODP.NET
        timeout-minutes: 1
        run: >-
          dotnet test
          --project tests/ServiceMantle.Database.Oracle.Tests/ServiceMantle.Database.Oracle.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --timeout 30s
          --filter-method ServiceMantle.Database.Oracle.Tests.OracleRealDatabaseTests.Real_database_environment_is_reachable
          --minimum-expected-tests 1
          --zero-tests-policy strict
          --fail-skips on

      - name: Test registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- test

      - name: Upload test diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Pack registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- pack
          --version $PACKAGE_VERSION
          --commit ${{ github.sha }}
          --output artifacts/packages

      - name: Verify package artifacts
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- verify
          --version $PACKAGE_VERSION
          --commit ${{ github.sha }}
          --input artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Stop Oracle Database Free
        if: always()
        shell: bash
        run: |
          if docker inspect servicemantle-oracle >/dev/null 2>&1; then
            docker rm --force servicemantle-oracle >/dev/null
          fi
