name: Bootstrap credential existence

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-credential-existence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  bootstrap-credential-existence-windows:
    name: Verify Bootstrap existence evidence on Windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Whether the Bootstrap file exists is decided from one read-only open, and Windows is the
      # platform where that open can be refused by another handle's share mode - a refusal Unix
      # cannot produce at all. This step runs only the class that covers that classification, so it
      # does not depend on the wider Windows Bootstrap filter in ci.yml, which still excludes the
      # credential contention tests tracked in #355.
      - name: Verify Bootstrap existence evidence
        run: >-
          dotnet test
          --project tests/ServiceMantle.Tests/ServiceMantle.Tests.csproj
          --configuration Release
          --timeout 5m
          --filter-class "ServiceMantle.Tests.Bootstrap.BootstrapCredentialExistenceTests"
          --minimum-expected-tests 1
          --zero-tests-policy strict
          --diagnostic
          --diagnostic-synchronous-write
          --diagnostic-output-directory artifacts/test-diagnostics/bootstrap-credential-existence

      - name: Upload test diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-credential-existence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-diagnostics
          if-no-files-found: ignore
          retention-days: 14
