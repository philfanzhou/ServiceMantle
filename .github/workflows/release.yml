name: Package release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  version:
    name: Decide package version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      number: ${{ steps.version.outputs.number }}
      tagged: ${{ steps.version.outputs.tagged }}
    steps:
      - name: Validate ref and choose version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [[ "$IS_TAG" != "true" ]]; then
            echo "number=0.0.0-edge.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use semantic versioning, for example v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi

          echo "number=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and publish package artifacts
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate package registry
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          -- validate

      - name: Restore registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- restore

      - name: Build registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- build
          --version ${{ needs.version.outputs.number }}
          --commit ${{ github.sha }}

      - name: Pack registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- pack
          --version ${{ needs.version.outputs.number }}
          --commit ${{ github.sha }}
          --output artifacts/packages

      - name: Verify package artifacts
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- verify
          --version ${{ needs.version.outputs.number }}
          --commit ${{ github.sha }}
          --input artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ needs.version.outputs.number }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
