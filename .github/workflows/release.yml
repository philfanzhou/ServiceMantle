name: Package release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  RELEASE_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  version:
    name: Decide package version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      number: ${{ steps.version.outputs.number }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      # Full history, because the tag has to be proved to be on main before anything is published.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # A tag can be pushed at any commit in the repository, including one that never passed review
      # and one on a branch that was abandoned. Publishing is irreversible on NuGet.org, so a tag
      # that is not an ancestor-or-self of main is refused here rather than after the fact.
      - name: Require the tag to be on main
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at a commit that is not contained in main." >&2
            exit 1
          fi

      # Build output belongs to this step's log, never to the version output file. Even a quiet
      # implicit build can print warnings that GitHub cannot parse as output records.
      - name: Build version resolver
        run: >-
          dotnet build
          eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release

      # The version rule lives in the release tool and is unit tested there, so this workflow never
      # carries a second copy of it that could drift.
      #
      # The ref name reaches the script through the environment rather than expression
      # interpolation: a git tag may contain quotes, and a name spliced into the command line could
      # then run as shell. The output is written to a file and appended afterwards instead of being
      # piped, so a rejected version fails the step rather than being swallowed by the pipeline's
      # last command.
      - name: Choose version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          UNTAGGED_VERSION: 0.0.0-edge.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          dotnet run \
            --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -- resolve-version \
            --ref-name "$REF_NAME" \
            --tagged "$IS_TAG" \
            --untagged-version "$UNTAGGED_VERSION" > "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The Windows Bootstrap existence evidence lives in its own workflow, so it is a pull-request
  # gate on its own and is not reached by reusing ci.yml. Release re-verification has to call it
  # explicitly, or a default-branch or tag push would publish without it. A workflow with its own
  # entry point is not wired here automatically: each one has to be checked and added.
  bootstrap-credential-existence:
    name: Verify Bootstrap existence evidence
    uses: ./.github/workflows/bootstrap-credential-existence.yml
    permissions:
      contents: read

  publish:
    name: Build and publish package artifacts
    needs: [version, verify, bootstrap-credential-existence]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate package registry
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          -- validate

      - name: Restore registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- restore

      - name: Build registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- build
          --version ${{ needs.version.outputs.number }}
          --commit ${{ github.sha }}

      - name: Pack registered projects
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- pack
          --version ${{ needs.version.outputs.number }}
          --commit ${{ github.sha }}
          --output artifacts/packages

      - name: Verify package artifacts
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          --no-build
          --no-restore
          -- verify
          --version ${{ needs.version.outputs.number }}
          --commit ${{ github.sha }}
          --input artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ needs.version.outputs.number }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

  # Separate from `publish` for one reason: this is the only job that may hold a publishing
  # credential, and `needs` makes it unreachable until the tag is proved to be on main, the source
  # is verified, the Bootstrap existence evidence is in, and every artifact has passed `verify`. A
  # failure or cancellation anywhere upstream leaves this job unrun, so nothing reaches NuGet.org.
  publish-nuget:
    name: Publish packages to NuGet.org
    needs: [version, verify, bootstrap-credential-existence, publish]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: nuget.org
    permissions:
      contents: read
      id-token: write
    steps:
      # This job holds a publishing credential and runs no git command, so the checkout token is
      # left out of the workspace rather than sitting in .git/config next to it.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The exact bytes that passed `verify` are what get pushed. Rebuilding here would publish
      # artifacts no gate has seen.
      - name: Download verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ needs.version.outputs.number }}
          path: artifacts/packages

      # Trusted Publishing: this exchanges the job's OIDC token for a short-lived NuGet.org API key,
      # so no long-lived secret exists in this repository to leak or rotate.
      - name: Acquire a short-lived NuGet.org credential
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish registered packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet run
          --project eng/ServiceMantle.ReleaseTool/ServiceMantle.ReleaseTool.csproj
          --configuration Release
          -- publish
          --version ${{ needs.version.outputs.number }}
          --commit ${{ github.sha }}
          --input artifacts/packages
          --source ${{ env.RELEASE_SOURCE }}
          --api-key-environment NUGET_API_KEY

  # Publishing succeeded is not the same as a consumer being able to use the result. This restores
  # the published version from NuGet.org itself, through a cache that has never held a ServiceMantle
  # package, so nothing local can make a broken package look installable.
  verify-published-packages:
    name: Verify the published packages restore from NuGet.org
    needs: [version, publish-nuget]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore and run a consumer from NuGet.org
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.number }}
        run: >-
          eng/tests/published-package-consumption.sh
          --version "$PACKAGE_VERSION"
          --source "${{ env.RELEASE_SOURCE }}"
          --consumer eng/tests/consumers/aspnetcore
